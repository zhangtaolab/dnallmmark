# Config example
# Note:
# task configurations are mandatory for both finetune and inference.
# when performing finetune or inference, leave the other one as it is.
# 
# For detailed TrainingArguments documentation, please refer to:
# https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
task:
    # 'mask' - mask language model; 'generation' - casual language model;
    # 'binary' - binary classification; 'multiclass' - multi-class classification; 'multilabel' - multi-label classification;
    # 'regression' - regression; 'token' - token classification, such as NER;
    # 'embedding' - get embedding, attention map and token probability
    task_type: "binary"
    # Labels information
    num_labels: 2
    label_names: ["negative", "positive"]
    # Threshold to distinguish between true and false sample in binary/multi-class classification tasks
    threshold: 0.5
finetune:
    # For detailed arguments, please refer to https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
    # Unlisted arguments can be added in the `extra_args` of DNATrainer
    output_dir: "./outputs"
    num_train_epochs: 3
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 1
    max_steps: -1
    logging_strategy: "steps"
    logging_steps: 500
    eval_strategy: "steps"
    eval_steps: 500
    save_strategy: "steps"
    save_steps: 500
    save_total_limit: 2
    save_safetensors: True
    learning_rate: 2e-5
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1e-8
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    lr_scheduler_type: "linear"
    lr_scheduler_kwargs: {}  # Empty dict for linear scheduler, or add specific parameters for other schedulers
    # Examples for other schedulers:
    # lr_scheduler_type: "cosine_with_restarts"
    # lr_scheduler_kwargs: {"num_restarts": 2}
    # lr_scheduler_type: "polynomial" 
    # lr_scheduler_kwargs: {"power": 1.0}
    # lr_scheduler_type: "reduce_lr_on_plateau"
    # lr_scheduler_kwargs: {"patience": 10, "factor": 0.1}
    seed: 42
    bf16: True
    fp16: False
    load_best_model_at_end: True
    metric_for_best_model: "eval_loss"
    report_to: "tensorboard"
    resume_from_checkpoint:
# Parameter-efficient fine-tuning sections (SC-6 lane tracer, 06-01).
# Field surfaces are suite-owned (dnallm/configuration/configs.py:400-423
# LoraConfig, :436-478 Ia3Config @ v1.2.1 (30dfd6d)) — no invented fields;
# values are the suite defaults. The lora: section is REQUIRED whenever the
# trainer is built with use_lora=True (dnallm trainer.py:421 indexes
# config["lora"] directly — KeyError without it) and inert otherwise; ia3:
# is optional for the suite (config.get default + preset resolution) and
# carried for explicitness.
lora:
    r: 8                     # LoRA attention dimension (rank)
    lora_alpha: 16
    target_modules: null     # null => suite preset auto-selection (lora_targets.yaml)
    lora_dropout: 0.1
    bias: "none"             # none|all|lora_only
    task_type: "SEQ_CLS"
ia3:
    target_modules: null     # null => suite preset auto-selection
    feedforward_modules: null  # preset fills; must stay a subset of target_modules
    task_type: "SEQ_CLS"