# Learning-curve config variant (SC-6/REV-08 F8, 06-05) — loaded by
# run_finetune.py --config-variant curve at the special_models reload slot.
# This is the base finetune_config.yaml block with the checkpoint cadence
# tightened from the 500/500/500 base to eval_steps 100 / save_steps 100 /
# logging_steps 50, so learning-curve points are dense enough to harvest
# offline: extract_curve_points (pipeline/run_sweep.py) reads the (step,
# eval-metrics) points back out of each cell's trainer_state.json
# log_history. Suite-owned TrainingArguments fields only. Pair with the
# curve-lane fraction cells (run_sweep --curve -> run_finetune
# --train_fraction, TRAIN split only, frac-nested output under
# seed_{s}/); note run_finetune's dynamic step override rescales the
# cadence to the fraction-sized train count for fraction runs.
task:
    # 'mask' - mask language model; 'generation' - casual language model;
    # 'binary' - binary classification; 'multiclass' - multi-class classification; 'multilabel' - multi-label classification;
    # 'regression' - regression; 'token' - token classification, such as NER;
    # 'embedding' - get embedding, attention map and token probability
    task_type: "binary"
    # Labels information
    num_labels: 2
    label_names: ["negative", "positive"]
    # Threshold to distinguish between true and false sample in binary/multi-class classification tasks
    threshold: 0.5
finetune:
    # For detailed arguments, please refer to https://huggingface.co/docs/transformers/en/main_classes/trainer#transformers.TrainingArguments
    # Unlisted arguments can be added in the `extra_args` of DNATrainer
    output_dir: "./outputs"
    num_train_epochs: 3
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 1
    max_steps: -1
    logging_strategy: "steps"
    logging_steps: 50
    eval_strategy: "steps"
    eval_steps: 100
    save_strategy: "steps"
    save_steps: 100
    save_total_limit: 2
    save_safetensors: True
    learning_rate: 2e-5
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1e-8
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    lr_scheduler_type: "linear"
    lr_scheduler_kwargs: {}  # Empty dict for linear scheduler, or add specific parameters for other schedulers
    seed: 42
    bf16: True
    fp16: False
    load_best_model_at_end: True
    metric_for_best_model: "eval_loss"
    report_to: "tensorboard"
    resume_from_checkpoint:
# Parameter-efficient fine-tuning sections (SC-6 lane tracer, 06-01) — the
# SAME sections as finetune_config.yaml so a variant reload composed with
# --peft lora can never hit KeyError 'lora' under use_lora=True. Field
# surfaces are suite-owned (dnallm/configuration/configs.py:400-423
# LoraConfig, :436-478 Ia3Config @ v1.2.1 (30dfd6d)); values are the suite
# defaults.
lora:
    r: 8                     # LoRA attention dimension (rank)
    lora_alpha: 16
    target_modules: null     # null => suite preset auto-selection (lora_targets.yaml)
    lora_dropout: 0.1
    bias: "none"             # none|all|lora_only
    task_type: "SEQ_CLS"
ia3:
    target_modules: null     # null => suite preset auto-selection
    feedforward_modules: null  # preset fills; must stay a subset of target_modules
    task_type: "SEQ_CLS"
